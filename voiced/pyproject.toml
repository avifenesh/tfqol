[project]
name = "voiced"
version = "0.1.0"
description = "Voice-to-terminal dictation daemon for Ghostty/tmux on Wayland"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.0.3",
    "sounddevice>=0.4.7",
    "webrtcvad-wheels>=2.0.14",
    "setuptools",  # webrtcvad-wheels imports pkg_resources
    "numpy>=1.26",
    "rapidfuzz>=3.9",
    "click>=8.1",
    "evdev>=1.7",
]

[project.scripts]
voiced = "voiced.daemon:main"
voicectl = "voiced.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voiced"]
